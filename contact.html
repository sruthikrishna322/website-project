<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Sweet Crumbs Bakery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🍰 Sweet Crumbs Bakery</h1>
    <p>We’d love to hear from you!</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="menu.html">Menu</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main>
    <div class="content-card">
      <h2>Contact Us</h2>
      <form onsubmit="event.preventDefault(); alert('Thank you for your order! We will contact you soon.'); this.reset();"
      <p>Have a question or want to place an order? Fill out the form below or visit our bakery in person.</p>

      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" required placeholder="Your name">

        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="you@example.com">

        <label for="message">Message:</label>
        <textarea id="message" rows="4" required placeholder="Your message..."></textarea>

        <button type="submit">Send Message</button>
        
      </form>
    </div>
  </main>

  <footer>
    <p>© 2025 <span>Sweet Crumbs Bakery</span> — Baked with love 💖</p>
  </footer>
</body>
</html>
